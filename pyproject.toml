[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spansynth-edit"
version = "0.1.0"
description = "MIDI-guided music synthesis and editing with SpanSynth-Edit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.5,<3",
  "numpy>=1.26,<3",
  "mido>=1.3,<2",
  "soundfile>=0.12,<1",
  "scipy>=1.11,<2",
  "safetensors>=0.4,<1",
  "huggingface-hub>=0.23,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
spansynth-edit = "spansynth.cli:main"

[tool.setuptools.packages.find]
include = ["spansynth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
